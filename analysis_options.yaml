# Static analysis for PulmoAI.
#
# Baseline: package:flutter_lints. On top of it this project turns on the rules
# that matter for a medical-imaging app where a silent numeric or lifecycle
# mistake changes a result rather than crashing: no implicit dynamic, no
# swallowed futures, explicit types on public API.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/l10n/generated/**
  errors:
    # an un-awaited future in the inference or database path is a real defect
    unawaited_futures: error
    # a missing switch arm over a verdict / source enum must not compile
    non_exhaustive_switch_statement: error
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_build_context_synchronously

    # API hygiene
    - avoid_escaping_inner_quotes
    - avoid_redundant_argument_values
    - avoid_returning_null_for_void
    - avoid_void_async
    - directives_ordering
    - omit_local_variable_types
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_enums
    - use_named_constants
    - use_string_buffers
