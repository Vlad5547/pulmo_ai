name: pulmo_ai
description: "On-device pneumonia screening on chest radiographs with PulmoNet-7M."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  flutter_onnxruntime: ^1.8.5
  image: ^4.10.1

  # picks .dcm files, which image_picker cannot see
  file_picker: ^13.1.0
  # persistent analysis history
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  # PDF report of a finished analysis, plus the share / save sheet
  pdf: ^3.11.1
  printing: ^5.13.4
  # localisation (uk / en / de)
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # drives the real ONNX Runtime on a device/desktop for the parity test
  integration_test:
    sdk: flutter
  # runs the SQLite repository tests on the desktop, without a device
  sqflite_common_ffi: ^2.3.4
  # generates the launcher icons from assets/icon/ (see flutter_launcher_icons
  # below); the artwork itself is drawn by tool/make_app_icon.py
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# Launcher icons. Regenerate with:
#   & $py tool\make_app_icon.py     (redraws assets/icon/*.png)
#   dart run flutter_launcher_icons  (writes the per-platform icon sets)
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#0E7C86"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
    background_color: "#0E7C86"
    theme_color: "#0E7C86"

flutter:

  uses-material-design: true

  # UI strings live in lib/l10n/*.arb; `flutter gen-l10n` (run automatically by
  # the build) generates lib/l10n/generated/app_localizations.dart.
  generate: true

  # The exported PulmoNet-7M model runs locally on the device; the card next to
  # it carries the input contract, the decision threshold and the test metrics.
  assets:
    - assets/models/pulmonet7m_cam.onnx
    - assets/models/model_card.json
